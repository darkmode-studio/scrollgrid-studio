name: Build ScrollGrid Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrollgrid-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage APK release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/ScrollGridStudio-debug.apk
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk release-assets/ScrollGridStudio-release-unsigned.apk
          fi
          ls -lh release-assets

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollgrid-studio-debug-apk
          path: release-assets/ScrollGridStudio-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollgrid-studio-release-apk
          path: release-assets/ScrollGridStudio-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScrollGrid Studio v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **ScrollGrid Studio** (commit `${{ github.sha }}`).

            - **Install on Android:** Download `ScrollGridStudio-debug.apk` directly (no unzipping required).
            - **Unsigned Release:** `ScrollGridStudio-release-unsigned.apk` (requires signing before install).
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          make_latest: true
